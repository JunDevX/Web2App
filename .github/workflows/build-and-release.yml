name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build -c Release --no-restore
    
    - name: Publish Windows Release
      run: dotnet publish -c Release -o ./publish-windows --self-contained -r win-x64
    
    - name: Create Windows ZIP
      shell: powershell
      run: |
        Compress-Archive -Path ./publish-windows/* -DestinationPath Web2App-windows.zip
    
    - name: Upload Windows Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: Web2App-windows.zip
        retention-days: 1

  create-release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write # 1. ИСПРАВЛЕНИЕ ОШИБКИ 403: Даем права на создание релизов
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Download Windows Build
      uses: actions/download-artifact@v4
      with:
        name: windows-build
    
    - name: Create Release and Upload Asset
      uses: softprops/action-gh-release@v2 # 2. ОБНОВЛЕНИЕ: Заменили v1 на v2 (убирает Warning про Node 20)
      with:
        tag_name: ${{ github.ref_name }} # 3. ДИНАМИЧЕСКИЙ ТЕГ: Берет тег из события (например, v1.0.1, v2.0.0)
        name: Release ${{ github.ref_name }}
        body: |
          # Web2App ${{ github.ref_name }} - Release
          
          ## Features
          - Create desktop applications from web addresses
          - Support for custom icons (ICO and PNG formats)
          - Automatic PNG to ICO format conversion
          - Desktop shortcut creation
          - User-Agent configuration for each application
          - Isolated directory for each application
          - Configuration saved in JSON format
          
          ## What's Included
          - **Web2App-windows.zip** - Windows application (self-contained)
          
          ## System Requirements
          - Windows 7 or higher
          - .NET 8.0 Runtime (included in the release)
          - Microsoft Edge WebView2 Runtime
          
          ## Installation
          1. Download `Web2App-windows.zip`
          2. Extract the archive
          3. Run `Web2AppLauncher.exe`
          
          ## Documentation
          - [README](https://github.com/JunDevX/Web2App/blob/main/README.md)
          - [English README](https://github.com/JunDevX/Web2App/blob/main/languages/readme-en.md)
          - [Contributing Guidelines](https://github.com/JunDevX/Web2App/blob/main/CONTRIBUTING.md)
          
          ---
          
          **Made with ❤️ for the developer community**
        files: Web2App-windows.zip
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
